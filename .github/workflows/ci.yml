name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck + tests + prod smoke
    runs-on: ubuntu-latest
    # A real PostgreSQL for the storage tests and the prod smoke; every other
    # test file stays on in-memory PGlite. The password is a throwaway for this
    # disposable CI container, not a secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      # corepack pins pnpm to the version in package.json#packageManager.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test

      # The same storage tests, against the real PostgreSQL service (each test
      # file creates and drops its own throwaway database).
      - name: Storage tests (PostgreSQL)
        run: pnpm vitest run src/server/db src/server/services/hosted-store.test.ts src/server/services/mcp-selection.test.ts src/server/services/mcp-versions.test.ts src/server/services/mcp-calls.test.ts src/server/services/mcp-api-key.test.ts
        env:
          DATABASE_URL: postgres://postgres:ci-throwaway@localhost:5432/postgres

      # Boots the ACTUAL compiled prod bundle and exercises real prod paths
      # (ESM/alias resolution, SPA fallback, parse child_process). The dev
      # test suite never touches dist/, so this is the only gate that catches
      # a broken production build.
      - name: Prod smoke (compiled bundle)
        run: pnpm prod:smoke
        env:
          DATABASE_URL: postgres://postgres:ci-throwaway@localhost:5432/postgres

      # The image the deployment runs, built from the Dockerfile with no build
      # argument: no secret ever goes into it.
      - name: Build the image
        run: docker build -t slice:ci .

      # Started as the deployment starts it: the settings go to `docker run`,
      # never to the build. The keys are drawn at random for this run only.
      - name: Start the image
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          export SLICE_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          docker run -d --name slice --network host \
            -e DATABASE_URL -e BETTER_AUTH_SECRET -e BETTER_AUTH_URL -e SLICE_ENCRYPTION_KEY \
            slice:ci
        env:
          DATABASE_URL: postgres://postgres:ci-throwaway@localhost:5432/postgres
          BETTER_AUTH_URL: http://localhost:3001
